 Each file goes on a new track; if you drop it on a track, it lands at that point.","Escriba el guion":"Write the script","en la vista Guion (tecla 3): elija un formato (cu\xF1a, entrevista, p\xF3dcast\u2026) y escriba; el reloj mide la duraci\xF3n. \xABPreparar pistas en el editor\xBB crea una pista por voz y marca en la regla d\xF3nde empieza cada l\xEDnea, y el bot\xF3n \xABGrabar\xBB de cada fila le muestra el texto mientras graba.":"in the Script view (key 3): choose a format (spot, interview, podcast\u2026) and write; the clock measures the length. \u201CPrepare tracks in the editor\u201D creates one track per voice and marks on the ruler where each line starts, and the \u201CRecord\u201D button on each row shows you the text while you record.",Grabe:"Record","su voz con el bot\xF3n rojo del transporte o May\xFAs+R: la primera vez se abre el panel de grabaci\xF3n para elegir el micr\xF3fono y comprobar el nivel (procure picos entre \u221218 y \u22126 dB). Cada toma queda en una pista \xABVoz\xBB como un clip m\xE1s; si hay m\xFAsica en otras pistas, suena mientras usted locuta (use auriculares).":"your voice with the red transport button or Shift+R: the first time, the recording panel opens so you can choose the microphone and check the level (aim for peaks between \u221218 and \u22126 dB). Each take lands on a \u201CVoice\u201D track as one more clip; if there is music on other tracks, it plays while you speak (use headphones).",Seleccione:"Select","arrastrando sobre una pista (o sobre la regla para todas las pistas). Haga clic en la barra de t\xEDtulo de un clip para seleccionarlo y arr\xE1strela para moverlo; arrastre sus bordes para recortarlo.":"by dragging over a track (or over the ruler for all tracks). Click a clip's title bar to select it and drag it to move it; drag its edges to trim it.","Elija la herramienta":"Choose the tool","en la barra superior: Mover (V) para seleccionar y arrastrar clips, Cuchilla (R) para cortarlos con un clic, Mover en bloque (Y) para desplazar todos los clips juntos y Selecci\xF3n de tiempo (T) para ubicar el cursor, reproducir con doble clic y seleccionar intervalos.":"in the top bar: Move (V) to select and drag clips, Razor (R) to cut them with a click, Slip all (Y) to move all clips together, and Time Selection (T) to place the playhead, play with a double-click and select ranges.","Ajuste volumen y panorama":"Adjust volume and pan","sobre el propio clip: la l\xEDnea amarilla es el volumen y la azul, el panorama (arriba, izquierda; abajo, derecha). Arr\xE1strelas para subirlas o bajarlas; un clic sobre una l\xEDnea a\xF1ade un punto, y con varios puntos se dibujan subidas, bajadas y desplazamientos (por ejemplo, bajar la m\xFAsica mientras entra la voz). Alt+clic o doble clic quita un punto. Los cuadritos de las esquinas superiores ajustan los fundidos.":"on the clip itself: the yellow line is volume and the blue one is pan (up is left; down is right). Drag them up or down; a click on a line adds a point, and with several points you can draw rises, dips and sweeps (for example, lowering the music while the voice comes in). Alt+click or double-click removes a point. The small squares in the top corners set the fades.",Edite:"Edit","con Cortar, Copiar, Pegar, Eliminar y Dividir (men\xFA Editar y Clip). Todo puede deshacerse; el panel Historial permite volver a cualquier paso.":"with Cut, Copy, Paste, Delete and Split (Edit and Clip menus). Everything can be undone; the History panel lets you return to any step.",Procese:"Process","la selecci\xF3n o los clips con el men\xFA Efectos (din\xE1mica, filtros y ecualizaci\xF3n, reducci\xF3n de ruido, reverberaci\xF3n, tono y tiempo, imagen est\xE9reo) o con un clic desde Favoritos. Cada efecto se puede escuchar antes de aplicarlo y deshacer despu\xE9s.":"the selection or the clips with the Effects menu (dynamics, filters and EQ, noise reduction, reverb, pitch and time, stereo image) or with one click from Favorites. Every effect can be previewed before applying it and undone afterwards.",Mezcle:"Mix","en la pesta\xF1a Mezclador: fader, panorama, Mute y Solo por pista y nivel maestro. Los medidores muestran la se\xF1al real en dBFS; el indicador CLIP se enciende si algo supera 0 dBFS.":"in the Mixer tab: fader, pan, Mute and Solo per track, and master level. The meters show the real signal in dBFS; the CLIP indicator lights up if anything goes above 0 dBFS.",Exporte:"Export","la mezcla a WAV (sin p\xE9rdida) o MP3 (comprimido, con etiquetas de t\xEDtulo y autor) y":"the mix to WAV (lossless) or MP3 (compressed, with title and author tags) and","el proyecto como archivo":"the project as a","(incluye los audios) para continuar otro d\xEDa. En Chrome y Edge, \xABGuardar como\u2026\xBB permite elegir la carpeta, y desde entonces Ctrl+S guarda directamente en ese archivo.":"file (it includes the audio) to continue another day. In Chrome and Edge, \u201CSave as\u2026\u201D lets you choose the folder, and from then on Ctrl+S saves straight to that file.","Los clips superpuestos en una misma pista se suman. Los fundidos son lineales. Las ediciones se reflejan de forma id\xE9ntica en la reproducci\xF3n y en la exportaci\xF3n porque ambas usan el mismo grafo de audio.":"Overlapping clips on the same track are summed. Fades are linear. Edits sound identical in playback and in export because both use the same audio graph.","Instalar Rimay Studio en este equipo":"Install Rimay Studio on this computer","Rimay Studio ya est\xE1 instalado":"Rimay Studio is already installed","y se est\xE1 ejecutando como aplicaci\xF3n. Los archivos":"and is running as an app. Files","se abren con doble clic: la primera vez, el sistema puede preguntar si permite que Rimay Studio los abra.":"open with a double-click: the first time, the system may ask whether to let Rimay Studio open them.","Al instalarlo, Rimay Studio se abre en su propia ventana, funciona sin conexi\xF3n y queda registrado para los archivos":"Once installed, Rimay Studio opens in its own window, works offline and is registered for",": con doble clic sobre un proyecto guardado, se abre directamente en el editor.":" files: double-click a saved project and it opens straight in the editor.","Rimay Studio se instal\xF3 en este equipo.":"Rimay Studio was installed on this computer.","Instalaci\xF3n cancelada.":"Installation cancelled.","Instalar ahora":"Install now","Chrome o Edge (Windows, macOS, Linux):":"Chrome or Edge (Windows, macOS, Linux):","y pulse el \xEDcono de instalar al final de la barra de direcciones, o use el men\xFA del navegador \u203A \xABInstalar Rimay Studio\xBB (en Edge: Aplicaciones \u203A Instalar este sitio como aplicaci\xF3n).":"and click the install icon at the end of the address bar, or use the browser menu \u203A \u201CInstall Rimay Studio\u201D (in Edge: Apps \u203A Install this site as an app).","Safari en macOS (versi\xF3n 17 o posterior):":"Safari on macOS (version 17 or later):","Archivo \u203A A\xF1adir al Dock. Safari no asocia los archivos .rimay; \xE1bralos con Archivo \u203A Abrir proyecto.":"File \u203A Add to Dock. Safari does not associate .rimay files; open them with File \u203A Open project.","Firefox:":"Firefox:","no permite instalar sitios como aplicaci\xF3n. Use Archivo \u203A Abrir proyecto o arrastre el archivo .rimay a la ventana.":"cannot install sites as apps. Use File \u203A Open project or drag the .rimay file onto the window.","Guardar en una carpeta elegida y volver a guardar sobre el mismo archivo funciona en Chrome y Edge de escritorio. En otros navegadores, el proyecto se descarga como archivo .rimay en la carpeta de descargas.":"Saving to a chosen folder and saving again over the same file works in desktop Chrome and Edge. In other browsers, the project downloads as a .rimay file to your downloads folder."};var ky={Invertir:"Invert",Invertido:"Inverted","Invierte la polaridad (fase 180\xB0). \xDAtil para corregir pistas en contrafase.":"Inverts the polarity (180\xB0 phase). he sound: Close is near and in front; Mid accompanies without competing with the voice; Far or background is distant.","C\xF3mo se mueve el sonido: entra, sube, baja a fondo (queda detr\xE1s de la voz), desaparece poco a poco (fade out), se corta en seco o se encadena con el siguiente.":"How the sound moves: comes in, rises, goes under (stays behind the voice), fades out gradually, stops with a hard cut, or crossfades into the next one.",Pausada:"Slow",Natural:"Natural",\u00C1gil:"Brisk","Una frase tiene {0} palabras: dif\xEDcil de decir sin respirar. Pruebe a dividirla con un punto.":"One sentence has {0} words: hard to say without taking a breath. Try splitting it with a period.","punto y coma":"semicolons",comillas:"quotation marks",asterisco:"asterisks","El o\xEDdo no oye {0}: reformule con punto o coma.":"The ear cannot hear {0}: rephrase with a period or a comma."," ni ":" or ","Cifra dif\xEDcil de retener: {0}. Redond\xE9ela o d\xEDgala con palabras.":"A figure that is hard to remember: {0}. Round it or say it in words.","Siglas: {0}. \xDAselas solo si todo el mundo las entiende.":"Acronyms: {0}. Use them only if everyone understands them.","Escriba como habla: frases cortas, una idea por frase.":"Write the way you speak: short sentences, one idea per sentence.","Quien escucha no puede volver atr\xE1s: repita la idea clave al final.":"Listeners cannot go back: repeat the key idea at the end.","Redondee las cifras y evite siglas que no conoce todo el mundo.":"Round off figures and avoid acronyms that not everyone knows.","Lea en voz alta: si se queda sin aire, la frase es demasiado larga.":"Read it aloud: if you run out of breath, the sentence is too long.","Use la m\xFAsica, los efectos y el silencio para contar lo que no dicen las palabras.":"Use music, sound effects and silence to tell what the words do not say.","Indique entre par\xE9ntesis c\xF3mo se dice: (susurrando), (con una sonrisa).":"Note in parentheses how it is said: (whispering), (with a smile).","Cu\xF1a de 30 segundos":"30-second spot","Un anuncio breve: gancho, mensaje y cierre con la marca.":"A short ad: hook, message and a close with the brand.","Cortina de apertura":"Opening theme","M\xFAsica que identifique el tono del anuncio.":"Music that sets the tone of the ad.","El gancho: una pregunta o situaci\xF3n que haga levantar la oreja. Ejemplo: \xBFSe le acab\xF3 el pan justo a la hora del caf\xE9?":"The hook: a question or situation that makes people prick up their ears. Example: Out of bread right at coffee time?","El mensaje: qu\xE9 ofrece, para qui\xE9n y por qu\xE9 conviene. Dos o tres frases cortas.":"The message: what you offer, for whom and why it is worth it. Two or three short sentences.","El dato pr\xE1ctico: d\xF3nde, cu\xE1ndo, cu\xE1nto o c\xF3mo contactar. Redondee las cifras.":"The practical detail: where, when, how much or how to get in touch. Round off figures.","El cierre: el nombre de la marca y una frase f\xE1cil de recordar.":"The close: the brand name and an easy-to-remember line.","Cortina de cierre":"Closing theme","La m\xFAsica sube y se desvanece.":"The music rises and fades away.","Anuncio dramatizado de 45 s":"45-second dramatized ad","Una escena corta entre dos personajes y la voz del locutor que cierra.":"A short scene between two characters, closed by the announcer's voice.","M\xFAsica breve que d\xE9 el tono.":"Brief music that sets the tone.","Lugar de la escena":"Scene location","\xBFD\xF3nde ocurre? Una tienda, una calle, una cocina. Queda bajo el di\xE1logo.":"Where does it happen? A shop, a street, a kitchen. It stays under the dialogue.","(actitud) El problema o la necesidad, en una frase.":"(attitude) The problem or the need, in one sentence.","(actitud) La respuesta que muestra lo que ofrece la marca.":"(attitude) The reply that shows what the brand offers.","(actitud) Una reacci\xF3n que refuerce el beneficio.":"(attitude) A reaction that reinforces the benefit.","Efecto de transici\xF3n":"Transition effect","Un sonido que cierre la escena: una puerta, una caja registradora.":"A sound that closes the scene: a door, a cash register.","El mensaje de la marca: qu\xE9 ofrece y por qu\xE9 elegirla.":"The brand message: what it offers and why to choose it.","El dato pr\xE1ctico y el cierre con el nombre de la marca.":"The practical detail and the close with the brand name.","Nota informativa de 1 minuto":"1-minute news item","Qu\xE9 pas\xF3, a qui\xE9n le afecta y qu\xE9 sigue, con una voz testimonial.":"What happened, who it affects and what comes next, with a witness voice.","Cortina informativa":"News theme","Identificador breve del espacio informativo.":"Brief identifier for the news segment.",PRESENTADOR:"ANCHOR","La entrada: el hecho m\xE1s importante en una frase. Qu\xE9 pas\xF3, d\xF3nde y cu\xE1ndo.":"The lead: the most important fact in one sentence. What happened, where and when.",REPORTERO:"REPORTER","El desarrollo: datos esenciales, redondeados, en frases cortas.":"The body: essential facts, rounded off, in short sentences.",TESTIMONIO:"WITNESS","(grabaci\xF3n) Una voz de quien vive el hecho. Escriba aqu\xED lo que dice o un resumen.":"(recording) The voice of someone living through the event. Write what they say here, or a summary.","Qu\xE9 sigue: la consecuencia o el pr\xF3ximo paso.":"What comes next: the consequence or the next step.","El cierre: repita la idea clave en una frase.":"The close: repeat the key idea in one sentence.","Microprograma de 2 minutos":"2-minute micro-show","Un tema contado con cortina, presentaci\xF3n, desarrollo y despedida.":"One topic told with a theme, an introduction, a body and a sign-off.","Cortina del programa":"Show theme","La m\xFAsica que identifica al programa.":"The music that identifies the show.","Saludo y tema: de qu\xE9 se habla hoy y por qu\xE9 importa a quien escucha.":"Greeting and topic: what today is about and why it matters to the listener.","Primera idea: un dato, una historia o una pregunta que enganche.":"First idea: a fact, a story or a question that hooks.",R\u00E1faga:"Sting","Una m\xFAsica corta que separa las partes.":"A short piece of music that separates the sections.","Segunda idea: un ejemplo cercano o un consejo pr\xE1ctico.":"Second idea: a familiar example or a practical tip.","Tercera idea: lo que quien escucha puede hacer.":"Third idea: what the listener can do.","Despedida: repita la idea clave e invite al pr\xF3ximo programa.":"Sign-off: repeat the key idea and invite listeners to the next show.","La cortina sube y se despide.":"The theme rises and says goodbye.","Entrevista de 5 minutos":"5-minute interview","Presentaci\xF3n de la persona invitada, preguntas y cierre.":"Introduction of the guest, questions and close.",Cortina:"Theme","M\xFAsica de presentaci\xF3n.":"Intro music.",CONDUCTOR:"HOST","Presente el tema y a la persona invitada: qui\xE9n es y por qu\xE9 la escuchamos.":"Introduce the topic and the guest: who they are and why we are listening to them.","Primera pregunta: abierta y sencilla, para que la persona entre en confianza.":"First question: open and simple, so the guest feels at ease.",INVITADA:"GUEST","(respuesta aproximada) Anote lo que se espera que cuente o deje en blanco si ser\xE1 espont\xE1neo.":"(approximate answer) Note what you expect them to say, or leave it blank if it will be spontaneous.","Segunda pregunta: el centro del tema.":"Second question: the heart of the topic.","(respuesta aproximada)":"(approximate answer)","Tercera pregunta: un ejemplo o una an\xE9cdota.":"Third question: an example or an anecdote.","Cierre: agradezca, resuma la idea clave y despida.":"Close: thank the guest, sum up the key idea and sign off.","La m\xFAsica sube y se despide.":"The music rises and says goodbye.","P\xF3dcast narrativo":"Narrative podcast","Una historia contada en primera persona, con escenas, ambientes y m\xFAsica.":"A story told in the first person, with scenes, ambiences and music.","Escena de apertura":"Opening scene","Abra con el sonido del lugar donde empieza la historia.":"Open with the sound of the place where the story begins.","El gancho: el momento m\xE1s intrigante de la historia, contado en presente.":"The hook: the most intriguing moment of the story, told in the present tense.","Tema del p\xF3dcast":"Podcast theme","La identidad sonora del p\xF3dcast.":"The podcast's sound identity.","Presentaci\xF3n: qui\xE9n cuenta, de qu\xE9 trata este episodio y por qu\xE9 importa.":"Introduction: who is telling it, what this episode is about and why it matters.","Primera escena: d\xF3nde estamos, qui\xE9n est\xE1, qu\xE9 pasa. Deje que el ambiente cuente el lugar.":"First scene: where we are, who is there, what is happening. Let the ambience tell the place.","Una pausa antes del giro.":"A pause before the twist.","El giro: lo inesperado que cambia la historia.":"The twist: the unexpected thing that changes the story.","El cierre: qu\xE9 aprendimos y una invitaci\xF3n al siguiente episodio.":"The close: what we learned and an invitation to the next episode.","Radioteatro breve":"Short radio drama","Una historia de ficci\xF3n con narrador, personajes, efectos y silencios.":"A fiction story with a narrator, characters, sound effects and silences.","Una m\xFAsica que anuncie el tono de la historia.":"Music that announces the tone of the story.","Sit\xFAe la historia: d\xF3nde, cu\xE1ndo y qui\xE9n la protagoniza.":"Set up the story: where, when and who it is about.","Ambiente de la escena":"Scene ambience","El lugar de la primera escena.":"The place of the first scene.","(actitud) La primera l\xEDnea de di\xE1logo.":"(attitude) The first line of dialogue.","(actitud) La respuesta.":"(attitude) The reply.","Efecto clave":"Key effect","El sonido que dispara el conflicto.":"The sound that triggers the conflict.","Tensi\xF3n antes del cl\xEDmax.":"Tension before the climax.","El desenlace.":"The ending.","Abarrotes La Vecina":"La Vecina Grocery","Anuncio dramatizado de 45 s para una tienda de barrio.":"45-second dramatized ad for a neighborhood store.","Ejemplo de Rimay Studio":"Rimay Studio example","Cu\xF1a publicitaria":"Radio spot","Cortina alegre. Baja a fondo cuando suena la campanita y se mantiene bajo el di\xE1logo.":"Upbeat theme. It goes under when the bell rings and stays under the dialogue.","Campanita de la puerta":"Shop door bell","Suena sobre la cortina, justo antes de la primera voz.":"It rings over the theme, just before the first voice.","Tienda de barrio":"Neighborhood store","Voces lejanas, una funda de pl\xE1stico, el zumbido de una nevera. Se mantiene bajo el di\xE1logo.":"Distant voices, a plastic bag, the hum of a fridge. It stays under the dialogue.","(apurada, amable, pregunta) Buenas, vecina. Tiene huevos.":"(in a hurry, friendly, asking) Morning, neighbor. Got any eggs?","(c\xE1lida) Frescos, de esta ma\xF1ana.":"(warm) Fresh, from this morning.","(pregunta) Y pan.":"(asking) And bread?","(orgullosa) Calientito.":"(proud) Still warm.","(dudando, en voz baja) Y\u2026 me f\xEDa hasta el viernes.":"(hesitating, quietly) And\u2026 could I pay you on Friday?","(riendo) Mija, aqu\xED nos conocemos todos.":"(laughing) Sweetheart, everybody knows everybody here.","El ambiente desaparece al terminar la frase.":"The ambience fades out as the line ends.","Caja registradora":"Cash register","Suena sobre el final de la frase de la TENDERA.":"It sounds over the end of the SHOPKEEPER's line.","Cama musical":"Music bed","La cortina sube un poco al entrar el LOCUTOR y queda entre 10 y 15 dB por debajo de su voz.":"The theme rises a little as the ANNOUNCER comes in and sits 10 to 15 dB below the voice.","(c\xE1lido, cercano) En Abarrotes La Vecina encuentra lo de todos los d\xEDas. Arroz, leche, frutas, verduras y el pan de la ma\xF1ana. Sin colas, sin vueltas, y a la vuelta de su casa.":"(warm, close) At La Vecina Grocery you'll find your everyday basics. Rice, milk, fruit, vegetables and fresh morning bread. No lines, no hassle, and right around the corner.","Abierto todos los d\xEDas, de seis de la ma\xF1ana a nueve de la noche.":"Open every day, from six in the morning to nine at night.","(pausado, con una sonrisa) Abarrotes La Vecina. Lo que necesita, a una cuadra.":"(unhurried, with a smile) La Vecina Grocery. What you need, one block away.","La cortina sube a primer plano y se desvanece.":"The theme comes up front and fades away.","La guitarra de la lluvia":"The Rain Guitar","Radioteatro breve con narrador, dos personajes, efectos y silencio.":"Short radio drama with a narrator, two characters, sound effects and silence.","Cuentos de mi barrio":"Stories from My Neighborhood","Guitarra ac\xFAstica lenta. Queda bajo la voz del narrador.":"Slow acoustic guitar. It stays under the narrator's voice.","En un barrio antiguo de Loja, las tardes de lluvia tienen due\xF1a. Se llama Rosa. Vende hierbas en el mercado desde hace cuarenta a\xF1os. Y cuando empieza a llover, cierra su puesto antes que nadie. Los vecinos dicen que corre a su casa para escuchar algo. Algo que solo suena cuando llueve.":"In an old neighborhood of Loja, in the Andes of Ecuador, rainy afternoons have an owner. Her name is Rosa. She has sold herbs at the market for forty years. And when it starts to rain, she closes her stall before anyone else. The neighbors say she runs home to listen to something. Something that only plays when it rains.","La m\xFAsica desaparece al terminar el p\xE1rrafo.":"The music fades out at the end of the paragraph.","Mercado al mediod\xEDa":"Market at noon","Voces lejanas, bolsas, una balanza. Se mantiene bajo los di\xE1logos.":"Distant voices, bags, a scale. It stays under the dialogue.","(apurada, cari\xF1osa) Mateo, mijo, ay\xFAdame con estas cajas. Ya viene el agua.":"(in a hurry, affectionate) Mateo, honey, help me with these boxes. The rain is coming.","(fastidiado) Abuela, no hay ni una nube. Siempre dice lo mismo.":"(annoyed) Grandma, there isn't a single cloud. You always say that.","(sonr\xEDe) Las nubes de aqu\xED no avisan, mijo. Pero yo s\xED las oigo.":"(smiling) The clouds here don't warn you, honey. But I can hear them.","Trueno lejano":"Distant thunder","Un solo trueno.":"A single thunderclap.","Lluvia en techo de zinc":"Rain on a tin roof","Entra suave y crece. El mercado desaparece debajo. Luego baja a fondo y se mantiene.":"It comes in softly and grows. The market fades out underneath. Then it goes under and holds.","Esa noche, Mateo se qued\xF3 en casa de su abuela. Afuera, la lluvia golpeaba el techo. Adentro, en un rinc\xF3n, hab\xEDa una guitarra vieja. Nadie la tocaba desde que muri\xF3 el abuelo Manuel. Nadie. Y a la medianoche, Mateo escuch\xF3 tres notas. Tres notas solas, suaves, que ven\xEDan del rinc\xF3n.":"That night, Mateo stayed at his grandmother's house. Outside, the rain drummed on the roof. Inside, in a corner, stood an old guitar. No one had played it since Grandpa Manuel died. No one. And at midnight, Mateo heard three notes. Three lonely, gentle notes, coming from the corner.","Lluvia en fondo bajo la voz.":"Rain in the background under the voice.","Tres notas de guitarra":"Three guitar notes","Notas espaciadas, con eco leve.":"Spaced-out notes, with a light echo.","Silencio total":"Total silence","Se corta tambi\xE9n la lluvia.":"The rain cuts out too.","(susurrando, asustado) Abuela. Abuela, la guitarra est\xE1 sonando sola.":"(whispering, scared) Grandma. Grandma, the guitar is playing by itself.","La lluvia vuelve a entrar en fondo al final de la frase.":"The rain comes back in the background at the end of the line.","(tranquila, en voz baja) No est\xE1 sola, mijo. Tu abuelo afinaba esa guitarra cada vez que llov\xEDa. Dec\xEDa que la madera se pone triste con el agua. Y que una guitarra triste hay que tocarla.":"(calm, quietly) It's not by itself, honey. Your grandfather tuned that guitar every time it rained. He said the wood gets sad in the wet. And a sad guitar has to be played.","Mateo no durmi\xF3. Al amanecer, sac\xF3 la guitarra del rinc\xF3n. Las cuerdas estaban flojas. La madera, h\xFAmeda. Le pidi\xF3 a su abuela que le ense\xF1ara la canci\xF3n. Ella no sab\xEDa tocar. Pero recordaba c\xF3mo sonaba. Y se la cant\xF3, despacito, una y otra vez.":"Mateo didn't sleep. At dawn, he took the guitar out of the corner. The strings were slack. The wood, damp. He asked his grandmother to teach him the song. She couldn't play. But she remembered how it sounded. And she sang it to him, slowly, again and again.","Guitarra desafinada":"Out-of-tune guitar","Mateo intenta la melod\xEDa: notas desafinadas, se corrige, vuelve a empezar.":"Mateo tries the melody: out-of-tune notes, he corrects himself, starts over.","Pasaron muchas lluvias. Mateo aprendi\xF3 la canci\xF3n nota por nota. Una tarde de octubre, el cielo se cerr\xF3 sobre el barrio. Rosa cerr\xF3 su puesto antes que nadie, como siempre. Corri\xF3 a su casa. Y esta vez, la guitarra no esperaba sola.":"Many rains went by. Mateo learned the song note by note. One October afternoon, the sky closed in over the neighborhood. Rosa closed her stall before anyone else, as always. She ran home. And this time, the guitar was not waiting alone.","Melod\xEDa completa en guitarra":"Full melody on guitar","La melod\xEDa de las tres notas, ahora completa y afinada. Lluvia en fondo.":"The three-note melody, now complete and in tune. Rain in the background.","(emocionada) As\xED mismito sonaba, Manuel. As\xED mismito.":"(moved) That's exactly how it sounded, Manuel. Exactly like that.","La guitarra baja a fondo.":"The guitar goes under.","En un barrio antiguo de Loja, las tardes de lluvia todav\xEDa tienen due\xF1a. Ahora son dos. Rosa, que escucha. Y Mateo, que toca. Esta fue La guitarra de la lluvia. Una historia de ficci\xF3n, escrita para ser escuchada.":"In an old neighborhood of Loja, rainy afternoons still have an owner. Now there are two. Rosa, who listens. And Mateo, who plays. This was The Rain Guitar. A work of fiction, written to be heard."
